            - paragraph [ref=f2e222]: Engagement dropped overnight? Your agent already rescheduled posts to better times. A competitor went viral on LinkedIn? It flagged it. Your best blog post started losing traffic? It drafted a refresh. You wake up to a briefing, not a fire drill.
